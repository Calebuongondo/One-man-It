services:
  - type: web
    runtime: static
    name: oneman-trade
    branch: master
    buildCommand: npm ci && npm run generate:brand-css && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CLIENT_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
